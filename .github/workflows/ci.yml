name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.17.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks (Turbo)
        run: pnpm turbo run lint check-types build test:int
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/portfolio-ci
          PAYLOAD_SECRET: ci-test-secret-min-32-chars-long
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          CRON_SECRET: ci-cron-secret
          PREVIEW_SECRET: ci-preview-secret
          REVALIDATE_SECRET: ci-revalidate-secret
